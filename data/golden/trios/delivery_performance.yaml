id: delivery_performance
question: How fast do we deliver orders, by distribution center?
intent: operations_delivery
tags: [delivery, shipping, fulfilment, logistics, distribution center, operations, late]
tables: [order_items, products]
sql: |
  SELECT p.distribution_center_id,
         COUNT(*) AS delivered_items,
         ROUND(AVG(TIMESTAMP_DIFF(oi.delivered_at, oi.created_at, HOUR)) / 24, 2) AS avg_days_to_deliver
  FROM order_items AS oi
  JOIN products AS p ON p.id = oi.product_id
  WHERE oi.delivered_at IS NOT NULL
    AND DATE(oi.created_at) >= DATE_SUB(CURRENT_DATE(), INTERVAL 6 MONTH)
  GROUP BY p.distribution_center_id
  ORDER BY avg_days_to_deliver DESC
interpretation:
  - Delivery time = delivered_at - created_at (order placed to delivered), in days.
analyst_report: |
  Delivery times are similar across distribution centers (~3-4 days); no single DC explains late orders.
