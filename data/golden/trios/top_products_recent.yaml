id: top_products_recent
question: What are our best-selling products in the last 90 days?
intent: product_ranking
tags: [products, best sellers, top, product performance, units, revenue]
tables: [order_items, products]
sql: |
  SELECT p.name AS product, p.brand, p.category,
         COUNT(*) AS units,
         ROUND(SUM(oi.sale_price), 2) AS net_revenue
  FROM order_items AS oi
  JOIN products AS p ON p.id = oi.product_id
  WHERE oi.status NOT IN ('Cancelled', 'Returned')
    AND DATE(oi.created_at) >= DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY)
  GROUP BY product, p.brand, p.category
  ORDER BY net_revenue DESC
  LIMIT 10
interpretation:
  - Rank by net revenue by default; mention units because cheap items can top unit charts.
analyst_report: |
  Best sellers are dominated by outerwear and premium denim; no single product exceeds 1% of revenue,
  so the assortment is long-tail. Keep top-20 items in stock with higher safety stock.
