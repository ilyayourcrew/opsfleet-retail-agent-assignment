id: compare_two_brands
question: Compare the performance of Levi's and Diesel - why do they perform differently?
intent: product_comparison
tags: [compare, comparison, brand, product, performance, returns, why, versus, x vs y]
tables: [order_items, products]
sql: |
  SELECT p.brand,
         COUNT(*) AS items_ordered,
         ROUND(SUM(IF(oi.status NOT IN ('Cancelled', 'Returned'), oi.sale_price, 0)), 2) AS net_revenue,
         ROUND(AVG(oi.sale_price), 2) AS avg_price,
         ROUND(COUNTIF(oi.status = 'Returned') / COUNT(*), 3) AS return_rate,
         ROUND(COUNTIF(oi.status = 'Cancelled') / COUNT(*), 3) AS cancel_rate,
         ROUND(SAFE_DIVIDE(SUM(oi.sale_price - p.cost), SUM(oi.sale_price)), 3) AS margin_pct
  FROM order_items AS oi
  JOIN products AS p ON p.id = oi.product_id
  WHERE p.brand IN ("Levi's", 'Diesel')
    AND DATE(oi.created_at) >= DATE_SUB(CURRENT_DATE(), INTERVAL 12 MONTH)
  GROUP BY p.brand
  ORDER BY net_revenue DESC
interpretation:
  - '"Why do they perform differently" is answered by decomposing: volume (items), price (avg price), leakage (return and cancel rates) and profitability (margin %).'
  - Compare on the same time window and include return/cancel rates - they usually explain most of the gap.
  - Substitute the brands/products/categories the user names.
analyst_report: |
  Levi's sells more units at a similar price point, but Diesel's return rate is ~4x higher, which wipes
  out most of its net revenue. Root cause hypothesis: sizing inconsistency. Action: add fit guidance and
  review the size chart for Diesel denim.
