id: state_spend_comparison
question: Why are users in Texas underspending, and how do they compare to users in California?
intent: segment_comparison_geo
tags: [state, underspending, spend, compare, geography, region, customers, segment, aov, basket]
tables: [order_items, users]
sql: |
  SELECT u.state,
         COUNT(DISTINCT u.id) AS customers,
         COUNT(DISTINCT oi.order_id) AS orders,
         ROUND(SUM(oi.sale_price), 2) AS net_revenue,
         ROUND(SUM(oi.sale_price) / COUNT(DISTINCT u.id), 2) AS revenue_per_customer,
         ROUND(COUNT(DISTINCT oi.order_id) / COUNT(DISTINCT u.id), 2) AS orders_per_customer,
         ROUND(SUM(oi.sale_price) / COUNT(DISTINCT oi.order_id), 2) AS avg_order_value,
         ROUND(COUNT(*) / COUNT(DISTINCT oi.order_id), 2) AS items_per_order,
         ROUND(AVG(oi.sale_price), 2) AS avg_item_price
  FROM order_items AS oi
  JOIN users AS u ON u.id = oi.user_id
  WHERE oi.status NOT IN ('Cancelled', 'Returned')
    AND u.state IN ('Texas', 'California')
  GROUP BY u.state
  ORDER BY revenue_per_customer DESC
interpretation:
  - '"Underspending" = lower revenue per customer. Decompose it: orders per customer x items per order x average item price.'
  - Demographics are only reported in aggregate (minimum group size applies).
  - Follow up by category mix or traffic source if the gap is mostly price-driven.
analyst_report: |
  Texas customers spend ~20% less per customer than California. Order frequency is similar; the gap is
  basket size (fewer items per order) and cheaper items. Action: test bundle offers and free-shipping
  thresholds for Texas.
