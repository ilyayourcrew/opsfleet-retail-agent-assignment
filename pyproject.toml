[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-agent"
version = "0.1.0"
description = "Data-analysis chat agent for retail executives (Google ADK + Gemini + BigQuery)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "google-adk>=2.14.1,<2.15",   # behaviour-pinned: see requirements.txt
    "sqlglot>=30.32,<31",         # the SQL guard depends on its AST classes
    "google-genai>=2.34,<4",
    "google-cloud-bigquery>=3.47,<4",
    "db-dtypes>=1.9,<2",
    "pandas>=3.1,<4",
    "duckdb>=2.0,<3",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.29,<0.30",
    "rich>=15,<16",
    "tenacity>=9.1,<10",
    "python-dotenv>=1.2,<2",
    "matplotlib>=3.11,<4",
]

[project.optional-dependencies]
ollama = ["litellm>=1.109,<2"]
dev = ["pytest>=9.2,<10", "pytest-asyncio>=1.5,<2", "ruff>=0.17,<0.18"]

[project.scripts]
retail-agent = "retail_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["online: needs Google Cloud + Gemini credentials (skipped by default)"]
addopts = "-m 'not online'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
